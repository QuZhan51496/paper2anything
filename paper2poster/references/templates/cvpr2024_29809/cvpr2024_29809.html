<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>__POSTER_TITLE__</title>
  <style>
:root {
  --primary: #4A7C59;
  --secondary: #2E86AB;
  --accent: #FFD166;
  --background: #FFFFFF;
  --text: #1A1A2E;
  --title-size: 84px;
  --section-size: 32px;
  --body-size: 20px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--background);
  color: var(--text); font-family: 'Inter','Helvetica Neue',Arial,sans-serif; }
.poster { position: relative; width: 2400px; height: 1800px;
  margin: 0; background: var(--background); }
.title-band { position: absolute; padding: 18px 36px;
  border-bottom: 4px solid var(--primary); }
.title-band.align-center { text-align: center; }
.title-band.align-left { text-align: left; }
.title-band.align-right { text-align: right; }
.poster-title { font-size: var(--title-size); margin: 0; color: var(--primary);
  line-height: 1.05; font-weight: 800; }
.poster-subtitle { font-size: 26px; margin-top: 8px; color: var(--text); }
.poster-affiliations { font-size: 20px; margin-top: 4px; color: var(--secondary); }
.headline { position: absolute; padding: 18px 28px;
  background: var(--primary); color: var(--background);
  display: flex; flex-direction: column; justify-content: center; }
.headline-claim { font-size: 28px; font-weight: 700; line-height: 1.25; }
.headline-metric { font-size: 22px; opacity: 0.9; margin-top: 6px; }
.visual { position: absolute; display: flex; flex-direction: column;
  margin: 0; gap: 8px; overflow: hidden; }
.visual img { width: 100%; flex: 1 1 auto; object-fit: contain;
  background: #fff; border: 1px solid rgba(0,0,0,0.08); }
.visual figcaption { font-size: 16px; color: var(--text);
  line-height: 1.3; flex: 0 0 auto; }
.visual.cap-above { flex-direction: column-reverse; }
.visual.cap-none figcaption { display: none; }
.panel { position: absolute; padding: 16px 22px;
  border-left: 4px solid var(--secondary); background: #fff; overflow: hidden; }
.panel h2 { font-size: var(--section-size); margin: 0 0 10px 0;
  color: var(--primary); }
.panel .bullets { font-size: var(--body-size); line-height: 1.4;
  color: var(--text); }
.panel .bullets ul { padding-left: 18px; margin: 0; }
.panel .bullets li { margin-bottom: 8px; }
.panel .bullets b, .panel .bullets strong { color: var(--primary); }
</style>
</head>
<body>
<div class="poster" data-archetype="cvpr2024_29809">
__PANELS__
</div>
</body>
</html>
